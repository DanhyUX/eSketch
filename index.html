<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Etch-a-Sketch</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      margin-bottom: 20px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Container for the grid */
    #container {
      width: 960px;
      height: 960px;
      display: flex;
      flex-wrap: wrap;
      border: 1px solid #000;
    }

    /* Individual grid squares */
    .square {
      box-sizing: border-box;
      background-color: white;
    }
  </style>
</head>
<body>

  <button id="resizeBtn">Resize Grid</button>

  <div id="container"></div>

  <script>
    const container = document.getElementById("container");
    const resizeBtn = document.getElementById("resizeBtn");
    const CONTAINER_SIZE = 960;

    // Create grid function
    function createGrid(size) {
      container.innerHTML = ""; // Remove existing grid

      const squareSize = CONTAINER_SIZE / size;

      for (let i = 0; i < size * size; i++) {
        const square = document.createElement("div");
        square.classList.add("square");

        square.style.width = `${squareSize}px`;
        square.style.height = `${squareSize}px`;

        // Store darkness level
        square.dataset.opacity = 0;

        square.addEventListener("mouseenter", () => {
          let currentOpacity = Number(square.dataset.opacity);

          if (currentOpacity < 1) {
            currentOpacity += 0.1;
            square.dataset.opacity = currentOpacity;

            // Random RGB color
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);

            square.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            square.style.opacity = currentOpacity;
          }
        });

        container.appendChild(square);
      }
    }

    // Button click event
    resizeBtn.addEventListener("click", () => {
      let newSize = prompt("Enter number of squares per side (max 100):");

      newSize = Number(newSize);

      if (newSize > 0 && newSize <= 100) {
        createGrid(newSize);
      } else {
        alert("Please enter a number between 1 and 100.");
      }
    });

    // Initial 16x16 grid
    createGrid(16);
  </script>

</body>
</html>
